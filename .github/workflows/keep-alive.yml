name: Supabase & Portfolio Keep-Alive Ping

on:
  schedule:
    # Runs every 3 days to prevent Supabase Free Tier project auto-pausing (after 7 days of inactivity)
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API & Portfolio Health
        run: |
          echo "Pinging Supabase Database & NexState AI Services..."
          curl -s "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" > /dev/null || true
          echo "Keep-alive ping completed successfully."
